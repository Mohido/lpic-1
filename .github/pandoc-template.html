<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$title$</title>
  <style>
    $highlighting-css$
    body{background:#1a1a1a;color:#d4d4d4;font-family:sans-serif;max-width:860px;margin:3rem auto;padding:0 1.5rem;line-height:1.7}
    h1,h2,h3,h4{color:#e8e8e8;border-bottom:1px solid #333;padding-bottom:.3rem}
    a{color:#6ab0f5}
    a:hover{color:#90c8ff}
    code{background:#2a2a2a;padding:.15em .35em;border-radius:3px;font-size:.9em}
    pre{background:#2a2a2a;padding:1rem;border-radius:5px;overflow-x:auto}
    pre code{background:none;padding:0}
    blockquote{border-left:3px solid #444;margin:0;padding-left:1rem;color:#999}
    hr{border:none;border-top:1px solid #333}
  </style>
</head>
<body>
$body$
</body>
</html>
