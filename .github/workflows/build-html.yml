name: Build HTML from Markdown

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pandoc
        run: sudo apt-get install -y pandoc

      - name: Convert markdown to HTML
        run: |
          rm -rf html 
          rm -rf .html
          mkdir -p html

          find . -name "*.md" \
            -not -path "./.github/*" \
            -not -path "./html/*" | while read -r md; do
            rel="${md#./}"
            out="html/${rel%.md}.html"
            mkdir -p "$(dirname "$out")"
            title=$(head -n 1 "$md" | sed 's/^#* *//')
            pandoc "$md" \
              --standalone \
              --metadata title="$title" \
              --highlight-style=tango \
              -o "$out"
          done

      - name: Generate index.html
        run: |
          python3 - <<'EOF'
          import os
          import html

          pages = []
          for root, dirs, files in os.walk("html"):
              dirs[:] = sorted(d for d in dirs)
              for f in sorted(files):
                  if f.endswith("html"):
                      path = os.path.join(root, f)
                      rel  = path[len("html/"):]
                      label = os.path.splitext(rel)[0].replace("/", " / ").replace("-", " ").replace("_", " ")
                      pages.append((rel, label))

          items = "\n".join(
              f'      <li><a href="{html.escape(p)}">{html.escape(l)}</a></li>'
              for p, l in pages
          )

          index = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>LPIC-1 Study Notes</title>
            <style>
              body {{ font-family: sans-serif; max-width: 800px; margin: 3rem auto; padding: 0 1rem; color: #222; }}
              h1   {{ border-bottom: 2px solid #ccc; padding-bottom: .4rem; }}
              ul   {{ list-style: none; padding: 0; }}
              li   {{ padding: .35rem 0; border-bottom: 1px solid #eee; }}
              a    {{ text-decoration: none; color: #0969da; }}
              a:hover {{ text-decoration: underline; }}
            </style>
          </head>
          <body>
            <h1>LPIC-1 Study Notes</h1>
            <ul>
          {items}
            </ul>
          </body>
          </html>
          """

          with open("html/index.html", "w") as fh:
              fh.write(index)

          print(f"index.html written with {len(pages)} entries")
          EOF

      - name: Commit and push HTML output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add html/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "ci: rebuild HTML from markdown [skip ci]"
          git push
