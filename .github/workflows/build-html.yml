name: Build HTML from Markdown

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pandoc
        run: sudo apt-get install -y pandoc

      - name: Convert markdown to HTML
        run: |
          rm -rf html
          rm -rf .html
          mkdir -p html

          cat > /tmp/dark.css <<'CSS'
          body { background:#1a1a1a; color:#d4d4d4; font-family:sans-serif; max-width:860px; margin:3rem auto; padding:0 1.5rem; line-height:1.7; }
          h1,h2,h3,h4 { color:#e8e8e8; border-bottom:1px solid #333; padding-bottom:.3rem; }
          a { color:#6ab0f5; }
          a:hover { color:#90c8ff; }
          code { background:#2a2a2a; padding:.15em .35em; border-radius:3px; font-size:.9em; }
          pre { background:#2a2a2a; padding:1rem; border-radius:5px; overflow-x:auto; }
          pre code { background:none; padding:0; }
          blockquote { border-left:3px solid #444; margin:0; padding-left:1rem; color:#999; }
          hr { border:none; border-top:1px solid #333; }
          CSS

          find . -name "*.md" \
            -not -path "./.github/*" \
            -not -path "./html/*" | while read -r md; do
            rel="${md#./}"
            out="html/${rel%.md}.html"
            mkdir -p "$(dirname "$out")"
            title=$(head -n 1 "$md" | sed 's/^#* *//')
            pandoc "$md" \
              --standalone \
              --metadata title="$title" \
              --highlight-style=breezeDark \
              -H /tmp/dark.css \
              -o "$out"
          done

      - name: Generate index.html
        run: |
          python3 - <<'EOF'
          import os
          import html

          pages = []
          for root, dirs, files in os.walk("html"):
              dirs[:] = sorted(d for d in dirs)
              for f in sorted(files):
                  if f.endswith("html"):
                      path = os.path.join(root, f)
                      rel  = path[len("html/"):]
                      label = os.path.splitext(rel)[0].replace("/", " / ").replace("-", " ").replace("_", " ")
                      pages.append((rel, label))

          items = "\n".join(
              f'      <li><a href="html/{html.escape(p)}">{html.escape(l)}</a></li>'
              for p, l in pages
          )

          index = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>LPIC-1 Study Notes</title>
            <style>
              body {{ font-family: sans-serif; max-width: 800px; margin: 3rem auto; padding: 0 1rem; color: #222; }}
              h1   {{ border-bottom: 2px solid #ccc; padding-bottom: .4rem; }}
              ul   {{ list-style: none; padding: 0; }}
              li   {{ padding: .35rem 0; border-bottom: 1px solid #eee; }}
              a    {{ text-decoration: none; color: #0969da; }}
              a:hover {{ text-decoration: underline; }}
            </style>
          </head>
          <body>
            <h1>LPIC-1 Study Notes</h1>
            <ul>
          {items}
            </ul>
          </body>
          </html>
          """

          with open("index.html", "w") as fh:
              fh.write(index)

          print(f"index.html written with {len(pages)} entries")
          EOF

      - name: Commit and push HTML output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add html/ index.html
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "ci: rebuild HTML from markdown [skip ci]"
          git push
